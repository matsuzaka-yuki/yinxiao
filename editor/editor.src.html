<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yinxiao 音效编辑器</title>
<!--
  yinxiao 音效编辑器（单文件：Tailwind CSS + Preact/htm 全部内联，运行期零外部请求）
  源码：editor/src.html　改完跑 editor/build.sh 重新内联生成这个文件。
-->
<style>/*__TAILWIND__*/</style>
<script>/*__VENDOR__*/</script>
</head>
<body class="bg-bg text-fg antialiased">

<!-- 画布配色跟随主题：只用中性色，靠线宽/虚线/透明深浅区分曲线 -->
<style>
  .tnum { font-variant-numeric: tabular-nums; }
  .lbl  { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-faint); }
</style>

<div id="app"></div>

<script>
const { h, render } = preact;
const { useState, useEffect, useRef, useCallback } = preactHooks;
const html = htm.bind(h);

/* ---------------------------------------------------------------- 小工具 */
const $c = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FMIN = 20, FMAX = 20000, DBMIN = -18, DBMAX = 18;
const PREFIX0 = 'effect_input.yx_';
const KIND_NAME = { eq: '参数均衡', widen: '声场加宽', sub: '并联低音', reverb: '卷积混响' };
const BAND_NAME = { HP: '高通', LP: '低通', LS: '低架', HS: '高架', PK: '峰值' };
const fmt = (v, n = 1) => (v === null || v === undefined || Number.isNaN(v)) ? '—' : v.toFixed(n);
const sgn = (v, n = 2) => (v >= 0 ? '+' : '') + v.toFixed(n);

/* 画布几何：对数频率 × 线性 dB */
const geom = (w, h) => {
  const pad = { l: 46, r: 16, t: 14, b: 22 };
  const pw = Math.max(10, w - pad.l - pad.r), ph = Math.max(10, h - pad.t - pad.b);
  return {
    pad, pw, ph,
    xf: f => pad.l + (Math.log10(f / FMIN) / Math.log10(FMAX / FMIN)) * pw,
    yf: d => pad.t + (DBMAX - d) / (DBMAX - DBMIN) * ph,
    fx: x => FMIN * Math.pow(FMAX / FMIN, (x - pad.l) / pw),
    fy: y => DBMAX - (y - pad.t) / ph * (DBMAX - DBMIN),
  };
};

/* ---------------------------------------------------------------- API */
async function api(path, body) {
  const r = await fetch(path, body === undefined ? undefined : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  return r.json();
}

/* ---------------------------------------------------------------- 曲线画布 */
function Curve({ st, cur, set, schedule }) {
  const cv = useRef(null), box = useRef(null);
  const drag = useRef(-1);
  const [hover, setHover] = useState(-1);

  // 尺寸跟随容器（ResizeObserver，避免只在 resize 事件时重算）
  const [, force] = useState(0);
  useEffect(() => {
    if (!box.current) return;
    const ro = new ResizeObserver(() => force(n => n + 1));
    ro.observe(box.current);
    return () => ro.disconnect();
  }, []);

  useEffect(() => { draw(); });

  function draw() {
    const c = cv.current; if (!c || !box.current) return;
    const dpr = devicePixelRatio || 1;
    const w = box.current.clientWidth, h = box.current.clientHeight;
    c.width = Math.max(1, w * dpr); c.height = Math.max(1, h * dpr);
    c.style.width = w + 'px'; c.style.height = h + 'px';
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);

    const fg = $c('--c-fg'), line = $c('--c-line'), dim = $c('--c-dim'), faint = $c('--c-faint');
    const G = geom(w, h), A = st.analysis;
    const withA = (a, al) => {
      // #rrggbb + alpha → rgba()
      const n = parseInt(fg.slice(1), 16);
      return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${al})`;
    };

    // 网格
    g.lineWidth = 1; g.font = '10px ui-monospace, monospace'; g.textBaseline = 'middle';
    g.strokeStyle = line;
    for (const db of [12, 6, 0, -6, -12]) {
      const y = Math.round(G.yf(db)) + .5;
      g.globalAlpha = db === 0 ? .9 : .35;
      g.beginPath(); g.moveTo(G.pad.l, y); g.lineTo(G.pad.l + G.pw, y); g.stroke();
    }
    g.globalAlpha = 1; g.fillStyle = faint; g.textAlign = 'right';
    for (const db of [12, 0, -12]) g.fillText(sgn(db, 0), G.pad.l - 8, G.yf(db));
    g.textAlign = 'center';
    for (const f of [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]) {
      const x = Math.round(G.xf(f)) + .5;
      g.globalAlpha = [100, 1000, 10000].includes(f) ? .9 : .25;
      g.beginPath(); g.moveTo(x, G.pad.t); g.lineTo(x, G.pad.t + G.ph); g.stroke();
      g.globalAlpha = 1; g.fillStyle = faint;
      g.fillText(f >= 1000 ? (f / 1000) + 'k' : f, x, G.pad.t + G.ph + 12);
    }

    if (!A) return;
    const xs = A.freqs, N = xs.length;
    const path = (arr, y0) => {
      g.beginPath();
      for (let i = 0; i < N; i++) {
        const x = G.xf(xs[i]), y = G.yf(Math.max(DBMIN * 1.6, Math.min(DBMAX * 1.6, arr[i])));
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
    };
    const isRev = cur && cur.kind === 'reverb';

    // 混响型：先铺一层半透明的原始谱线（噪声型 IR 的频谱本来就是尖的）
    if (A.ch_smooth) {
      g.lineWidth = 1;
      g.strokeStyle = withA(fg, .22); path(A.ch_db); g.stroke();
      g.strokeStyle = withA(fg, .22); path(A.sigma_db); g.stroke();
    }
    // σmax 包络：最坏情况增益（唯一需要“余量”概念的地方）
    const sig = A.sigma_smooth || A.sigma_db;
    path(sig); g.lineTo(G.pad.l + G.pw, G.pad.t + G.ph); g.lineTo(G.pad.l, G.pad.t + G.ph); g.closePath();
    g.fillStyle = withA(fg, .07); g.fill();
    g.lineWidth = 1; g.strokeStyle = withA(fg, .40); path(sig); g.stroke();

    // 侧向 / 单声道下混：只有加宽、并联低音这两类才有意义
    if (cur && (cur.kind === 'widen' || cur.kind === 'sub')) {
      g.setLineDash([5, 4]); g.lineWidth = 1.2; g.strokeStyle = withA(fg, .55); path(A.side_db); g.stroke();
      g.setLineDash([2, 3]); g.lineWidth = 1; g.strokeStyle = withA(fg, .35); path(A.mono_db); g.stroke();
      g.setLineDash([]);
    }

    // 主曲线：居中内容响应；混响型画 1/3 倍频程平滑版（否则是一团毛刺）
    const main = A.ch_smooth || A.corr_db || A.ch_db;
    path(main); g.lineTo(G.pad.l + G.pw, G.yf(0)); g.lineTo(G.pad.l, G.yf(0)); g.closePath();
    g.fillStyle = withA(fg, .10); g.fill();
    g.lineWidth = 2; g.strokeStyle = fg; path(main); g.stroke();

    // 鼠标十字线
    if (st.mouseF >= FMIN) {
      g.setLineDash([3, 3]); g.lineWidth = 1; g.strokeStyle = withA(fg, .35);
      g.beginPath(); g.moveTo(G.xf(st.mouseF), G.pad.t); g.lineTo(G.xf(st.mouseF), G.pad.t + G.ph); g.stroke();
      g.setLineDash([]);
    }

    // 滤波器手柄（只有参数均衡型可拖）
    if (cur && cur.kind === 'eq') {
      cur.bands.forEach((b, i) => {
        const x = G.xf(b.freq), y = G.yf(b.gain), on = i === st.sel;
        g.beginPath(); g.arc(x, y, on ? 6.5 : 5, 0, 7);
        g.fillStyle = on ? fg : withA(fg, .10);
        g.strokeStyle = on ? fg : withA(fg, .65); g.lineWidth = 1.5;
        g.fill(); g.stroke();
        if (on || i === hover) {
          g.fillStyle = fg; g.textAlign = 'left'; g.font = '11px ui-monospace, monospace';
          const t = `${BAND_NAME[b.kind] || b.kind}  ${Math.round(b.freq)}Hz  Q${b.q.toFixed(2)}  ${sgn(b.gain, 1)}dB`;
          g.fillText(t, Math.min(x + 10, w - 190), Math.max(y - 12, 12));
        }
      });
    }
  }

  function pick(ev) {
    if (!cur || cur.kind !== 'eq') return -1;
    const r = cv.current.getBoundingClientRect();
    const G = geom(r.width, r.height);
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    let best = -1, bd = 15;
    cur.bands.forEach((b, i) => {
      const d = Math.hypot(G.xf(b.freq) - mx, G.yf(b.gain) - my);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  const onDown = ev => {
    const i = pick(ev);
    if (i >= 0) { drag.current = i; set({ sel: i }); ev.target.setPointerCapture?.(ev.pointerId); }
    else set({ sel: -1 });
    draw();
  };
  const onMove = ev => {
    const r = cv.current.getBoundingClientRect(), G = geom(r.width, r.height);
    const f = G.fx(ev.clientX - r.left);
    set({ mouseF: Math.max(FMIN, Math.min(FMAX, f)) });
    if (drag.current >= 0 && cur && cur.bands[drag.current]) {
      const b = cur.bands[drag.current];
      b.freq = Math.max(20, Math.min(20000, G.fx(ev.clientX - r.left)));
      b.gain = Math.max(DBMIN, Math.min(DBMAX, G.fy(ev.clientY - r.top)));
      schedule({ bands: cur.bands });          // 拖动即试听（实时试听开着时）
      force(n => n + 1);
    } else {
      setHover(pick(ev));
    }
  };
  const onUp = () => { drag.current = -1; };
  const onLeave = () => { setHover(-1); set({ mouseF: 0 }); };

  // 滚轮改 Q 需要 passive:false 才能阻止页面滚动
  useEffect(() => {
    const el = cv.current;
    const onWheel = ev => {
      if (!cur || cur.kind !== 'eq') return;
      const i = hover >= 0 ? hover : st.sel;
      if (i < 0 || !cur.bands[i]) return;
      ev.preventDefault();
      const b = cur.bands[i];
      b.q = Math.max(0.2, Math.min(8, b.q * (ev.deltaY > 0 ? 0.92 : 1.08)));
      set({ sel: i });
      schedule({ bands: cur.bands });
      force(n => n + 1);
    };
    el.addEventListener('wheel', onWheel, { passive: false });
    return () => el.removeEventListener('wheel', onWheel);
  }, [hover, st.sel, cur]);

  const G = null;
  return html`<div ref=${box} class="absolute inset-0">
    <canvas ref=${cv} class="cursor-crosshair"
      onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp}
      onPointerLeave=${onLeave} onPointerCancel=${onUp}></canvas>
  </div>`;
}

/* ---------------------------------------------------------------- 通用小件 */
const Row = ({ label, children, w = 'w-20' }) => html`
  <div class="flex items-center gap-3">
    <span class=${'shrink-0 text-[11px] text-dim ' + w}>${label}</span>
    ${children}
  </div>`;

const Slider = ({ label, value, min, max, step, onInput, unit = '', digits = 2, disabled }) => html`
  <${Row} label=${label}>
    <input type="range" class="flex-1" min=${min} max=${max} step=${step} value=${value}
      disabled=${disabled} onInput=${e => onInput(+e.target.value)} />
    <span class="tnum w-[68px] text-right text-[11px] text-fg">${
      value === null || value === undefined ? '—' : Number(value).toFixed(digits) + unit}</span>
  <//>`;

const KV = ({ k, v, mono = true }) => html`
  <div class="flex items-baseline justify-between gap-3 text-[11px]">
    <span class="text-dim">${k}</span>
    <span class=${'text-right ' + (mono ? 'tnum text-fg' : 'text-fg')}>${v}</span>
  </div>`;

const Btn = ({ children, onClick, kind = 'ghost', disabled, title, active }) => {
  const base = 'rounded-md px-3 py-1.5 text-[12px] transition-colors disabled:opacity-40 disabled:cursor-default';
  const theme = {
    ghost: 'border border-line text-fg hover:bg-raised',
    primary: 'bg-fg text-bg font-medium hover:opacity-90',
    plain: 'text-dim hover:text-fg',
    tab: active ? 'bg-fg text-bg' : 'text-dim hover:text-fg',
  }[kind];
  return html`<button title=${title} disabled=${disabled} onClick=${onClick}
    class=${base + ' ' + theme}>${children}</button>`;
};

const Tabs = ({ items, value, onChange }) => html`
  <div class="flex gap-1 rounded-md border border-line p-0.5">
    ${items.map(([id, label]) => html`
      <button key=${id} onClick=${() => onChange(id)}
        class=${'rounded px-2.5 py-1 text-[11px] transition-colors ' +
                (value === id ? 'bg-fg text-bg' : 'text-dim hover:text-fg')}>${label}</button>`)}
  </div>`;

/* ---------------------------------------------------------------- 面板：各类预设 */
function BandPanel({ cur, st, set, schedule, addBand, delBand }) {
  const i = st.sel, b = cur.bands[i];
  const on = !!b;
  return html`
    <div class="space-y-2.5">
      <${Row} label="选中" w="w-14"><span class="text-[12px]">${
        on ? `${BAND_NAME[b.kind] || b.kind} · ${b.node}` : '未选中'}</span><//>
      <${Slider} label="频率" min="20" max="20000" step="1" digits="0" unit=" Hz" disabled=${!on}
        value=${on ? b.freq : 1000} onInput=${v => { b.freq = v; set({}); schedule({ bands: cur.bands }); }} />
      <${Slider} label="Q" min="0.2" max="8" step="0.02" disabled=${!on}
        value=${on ? b.q : 1} onInput=${v => { b.q = v; set({}); schedule({ bands: cur.bands }); }} />
      <${Slider} label="增益" min="-18" max="18" step="0.1" unit=" dB" disabled=${!on}
        value=${on ? b.gain : 0} onInput=${v => { b.gain = v; set({}); schedule({ bands: cur.bands }); }} />
      <div class="flex gap-2 pt-0.5">
        <${Btn} onClick=${addBand}>+ 加一段峰值<//>
        <${Btn} onClick=${delBand} disabled=${!on}>删除所选<//>
      </div>
      <p class="pt-1 text-[10.5px] leading-relaxed text-faint">
        画布上拖圆点改频率/增益，滚轮改 Q，<span class="rounded border border-line px-1">Del</span> 删除
      </p>
    </div>`;
}

function ReverbPanel({ cur, st, schedule }) {
  const r = cur.reverb || {}, A = st.analysis || {};
  return html`
    <div class="space-y-2.5">
      <${Slider} label="干湿比" min="0" max="2" step="0.01" value=${r.wet ?? 0}
        onInput=${v => { cur.reverb = { ...r, wet: v }; set({}); schedule({ reverb: cur.reverb }); }} />
      <div class="grid grid-cols-2 gap-x-6 gap-y-1 pt-1 xl:grid-cols-3">
        <${KV} k="1kHz 湿/干" v=${A.mix_1k_db === undefined ? '—' : fmt(A.mix_1k_db, 1) + ' dB'} />
        <${KV} k="混响时间 RT60" v=${r.rt60 ? fmt(r.rt60, 2) + ' s' : '—'} />
        <${KV} k="预延迟" v=${r.predelay_ms != null ? r.predelay_ms + ' ms' : '—'} />
        <${KV} k="湿路高通" v=${r.wet_hp ? Math.round(r.wet_hp) + ' Hz' : '—'} />
        <div class="col-span-2 xl:col-span-1">
          <${KV} k="脉冲响应" v=${r.ir || '—'} />
        </div>
      </div>
      <p class="pt-1 text-[10.5px] leading-relaxed text-faint">
        RT60 与预延迟烘在脉冲响应里，换预设即可；干湿比实时可调。
      </p>
    </div>`;
}

function MatrixPanel({ cur, st, schedule }) {
  const m = cur.matrix || {}, isW = 'k' in m;
  return html`
    <div class="space-y-2.5">
      ${isW ? html`
        <${Slider} label="宽度 k" min="-0.8" max="1.2" step="0.01" value=${m.k}
          onInput=${v => { cur.matrix = { ...m, k: v }; set({}); schedule({ matrix: cur.matrix }); }} />
        <p class="text-[10.5px] text-faint">k 为 0 原样、为正加宽声场、为负收窄贴耳（单声道兼容）</p>`
      : html`
        <${Slider} label="分频点" min="40" max="300" step="1" digits="0" unit=" Hz" value=${m.xfreq || 90}
          onInput=${v => { cur.matrix = { ...m, xfreq: v }; set({}); schedule({ matrix: cur.matrix }); }} />
        <${Slider} label="低频增益" min="0" max="1.5" step="0.01" value=${m.sub ?? 0}
          onInput=${v => { cur.matrix = { ...m, sub: v }; set({}); schedule({ matrix: cur.matrix }); }} />`}
    </div>`;
}

/* ---------------------------------------------------------------- 画布下方常驻状态栏
   为什么不做成右栏：右栏在窗口窄时只能隐藏，结果"还有多少削顶余量"就看不见了。
   安全信息必须永远可见，所以做成横条（窄屏自动换行）。 */
function StatusBar({ st, cur, set, schedule }) {
  const A = st.analysis;
  const bnd = A && A.sigma_bound;
  const sm = A ? (bnd !== undefined && bnd !== null ? Math.pow(10, bnd / 20) : A.sigma_max) : null;
  const marg = sm ? -20 * Math.log10(sm) : null;
  const safe = sm !== null && sm <= 1.0005;
  let k = null, f = st.mouseF;
  if (A && f) {
    let bd = 1e9;
    A.freqs.forEach((x, i) => { const d = Math.abs(Math.log(x / f)); if (d < bd) { bd = d; k = i; } });
  }
  const rd = key => (k === null ? '—' : sgn(A[key][k], 1) + ' dB');
  const item = (children, cls = '') => html`<div class=${'flex items-center gap-2 ' + cls}>${children}</div>`;
  return html`
  <div class="flex flex-wrap items-center gap-x-5 gap-y-1.5 border-t border-line bg-panel px-4 py-2">
    ${item(html`
      <span class="text-[11px] text-dim">preamp</span>
      ${cur && cur.preamp == null
        ? html`<span class="text-[11px] text-dim">矩阵型内建（无独立 preamp）</span>`
        : html`<input type="range" class="w-32" min="-24" max="6" step="0.25"
            value=${cur ? cur.preamp : 0} disabled=${st.autoPreamp}
            onInput=${e => { cur.preamp = +e.target.value; set({});
              schedule({ preamp: cur.preamp }, { auto_preamp: false }); }} />
          <span class="tnum w-[58px] text-[11px]">${fmt(cur.preamp, 2)} dB</span>`}`)}
    ${item(html`<label class="flex cursor-pointer items-center gap-1.5 text-[11px] text-dim">
      <input type="checkbox" class="accent-fg" checked=${st.autoPreamp}
        onChange=${e => { set({ autoPreamp: e.target.checked }); schedule({}, {}); }} />
      自动归一化</label>`)}
    ${item(html`<span class="text-[11px] text-dim">σmax${bnd != null ? '（解析上界）' : ''}</span>
      <span class="tnum text-[12px] font-medium">${fmt(sm, 4)}</span>`)}
    ${item(html`<span class="text-[11px] text-dim">削顶余量</span>
      <span class="tnum text-[12px]">${marg === null ? '—' : sgn(marg, 2) + ' dB'}</span>`)}
    ${item(html`<span class="text-[12px] font-medium">${
      sm === null ? '' : safe ? '✔ 任意输入下都不会削顶' : `⚠ 最坏超 ${fmt(-marg, 2)} dB`}</span>`,
      'border-l border-line pl-5')}
    <span class="ml-auto"></span>
    ${item(html`<span class="text-[11px] text-dim">@ ${f ? Math.round(f) + ' Hz' : '—'}</span>
      <span class="tnum text-[11px] text-dim">居中 ${k === null ? '—' : rd('corr_db')}
      · 侧向 ${k === null ? '—' : rd('side_db')}
      · 最坏 ${k === null ? '—' : rd('sigma_db')}
      · 单声道 ${k === null ? '—' : rd('mono_db')}</span>`)}
  </div>`;
}

/* ---------------------------------------------------------------- 主组件 */
function App() {
  const [st, setSt] = useState({
    presets: [], curId: null, sel: -1, live: false, switchOnClick: true, autoPreamp: true,
    analysis: null, mouseF: 0, activeSink: '', prefix: PREFIX0, err: null, ready: false,
    theme: localStorage.getItem('yinxiao-theme') || 'dark', flash: '', busy: false,
  });
  const set = patch => setSt(s => ({ ...s, ...patch }));
  const stRef = useRef(st); stRef.current = st;
  const cur = st.presets.find(p => p.id === st.curId) || null;
  const q = useRef({ pending: null, busy: false });

  useEffect(() => {
    document.documentElement.className = st.theme;
    localStorage.setItem('yinxiao-theme', st.theme);
  }, [st.theme]);

  /* 统一发请求：拖动的中间态只保留最后一个（schedule），避免请求排队滞后 */
  const flush = useCallback(async () => {
    const job = q.current.pending; q.current.pending = null;
    if (!job) { q.current.busy = false; return; }
    q.current.busy = true;
    try {
      const r = await api('/api/apply', {
        preset_id: job.id, spec: job.spec, live: stRef.current.live, ...job.opts,
      });
      const patch = { analysis: r.analysis, err: r.error || null };
      if (r.preamp !== undefined) {
        patch.presets = stRef.current.presets.map(p => p.id === job.id ? { ...p, preamp: r.preamp } : p);
      }
      if (r.live_error) patch.flash = '实时下发失败: ' + r.live_error;
      setSt(s => ({ ...s, ...patch }));
    } catch (e) { set({ err: String(e) }); }
    q.current.busy = false;
    if (q.current.pending) flush();
  }, []);
  const schedule = useCallback((spec, opts = {}) => {
    const s = stRef.current;
    q.current.pending = { id: s.curId, spec, opts };
    if (!q.current.busy) flush();
  }, [flush]);

  /* 只拉当前预设的分析（不动正在编辑的内容） */
  const loadAnalysis = useCallback(async (id) => {
    const r = await api('/api/apply', { preset_id: id, spec: {}, live: false });
    set({ analysis: (r && r.analysis) || null });
  }, []);

  /* 拉全量状态。注意别在这之后用 stRef 去查刚设进去的 presets——
     set() 是异步的，这一拍拿到的还是旧数组（踩过一次：预设列表空着不显示） */
  const reload = useCallback(async (keepId) => {
    const d = await api('/api/state');
    const prev = stRef.current.curId;
    const pick = (keepId && prev && d.presets.some(p => p.id === prev))
      ? prev : (d.presets[0] || {}).id;
    set({ presets: d.presets, activeSink: d.active_sink, prefix: d.prefix || PREFIX0,
          ready: true, curId: pick, sel: -1, tab: null });
    if (pick) await loadAnalysis(pick);
  }, [loadAnalysis]);

  /* 选预设：默认顺手把系统输出切过去（和 QQ音乐一样） */
  const selectId = useCallback(async (id, opts = {}) => {
    const s = stRef.current;
    const p = s.presets.find(x => x.id === id); if (!p) return;
    set({ curId: id, sel: -1, analysis: null, tab: null, err: null });
    if (opts.switchSink !== false && s.switchOnClick) {
      const r = await api('/api/select', { preset_id: id });
      if (r && r.active_sink) set({ activeSink: r.active_sink });
    }
    await loadAnalysis(id);
  }, [loadAnalysis]);

  useEffect(() => { reload(true); }, []);

  /* 每 4 秒只刷新“谁是当前输出”，不动正在编辑的内容 */
  useEffect(() => {
    const t = setInterval(async () => {
      if (q.current.busy) return;
      try {
        const d = await api('/api/state');
        const patch = { activeSink: d.active_sink };
        // 别处（编辑器另一标签页 / 命令行）改过参数时，把非当前预设的 dirty 状态同步回来
        patch.presets = stRef.current.presets.map(p => {
          const n = d.presets.find(x => x.id === p.id);
          return n ? { ...p, dirty: n.dirty } : p;
        });
        set(patch);
      } catch (_) {}
    }, 4000);
    return () => clearInterval(t);
  }, []);

  const act = async (path, body) => {
    try { return await api(path, body); } catch (e) { set({ err: String(e) }); }
  };
  const save = async () => {
    if (!cur) return;
    const r = await act('/api/apply', {
      preset_id: cur.id, spec: { bands: cur.bands, matrix: cur.matrix, reverb: cur.reverb },
      save: true, live: false, auto_preamp: st.autoPreamp,
    });
    set({ flash: '已保存到磁盘 ✓', analysis: (r && r.analysis) || st.analysis });
    setTimeout(() => set({ flash: '' }), 1600);
    reload(true);
  };
  const revert = async () => {
    if (!cur) return;
    await act('/api/revert', { preset_id: cur.id });
    set({ flash: '已放弃未保存的修改' }); setTimeout(() => set({ flash: '' }), 1400);
    reload(true);
  };
  const rollback = async () => {
    if (!cur) return;
    const r = await act('/api/restore_bak', { preset_id: cur.id, live: st.live });
    if (r && r.error) { set({ flash: r.error }); setTimeout(() => set({ flash: '' }), 2000); return; }
    set({ flash: '已回滚到上次保存前 ✓' }); setTimeout(() => set({ flash: '' }), 1600);
    reload(true);
  };
  const addBand = async () => {
    if (!cur) return;
    const id = cur.id;
    await act('/api/add_band', { preset_id: id });
    const d = await api('/api/state');               // 重新取一次，拿到新段的下标
    const p = d.presets.find(x => x.id === id);
    set({ presets: d.presets, curId: id, sel: p ? p.bands.length - 1 : -1 });
    await loadAnalysis(id);
  };
  const delBand = async () => {
    if (!cur || st.sel < 0) return;
    const nd = cur.bands[st.sel].node;
    await act('/api/del_band', { preset_id: cur.id, node: nd });
    await reload(true);
    set({ sel: -1 });
  };
  const bypass = async () => {
    await act('/api/off', { preset_id: st.curId });
    const d = await api('/api/state'); set({ activeSink: d.active_sink });
  };

  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Delete' && st.sel >= 0 && document.activeElement.tagName !== 'INPUT') delBand();
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  });

  if (!st.ready) return html`<div class="grid h-screen place-items-center text-[12px] text-dim">正在读取预设…</div>`;
  if (!cur) return html`<div class="grid h-screen place-items-center text-[12px] text-dim">
    没有读到预设 —— 检查 conf 目录与编辑器日志。</div>`;

  const kind = cur ? cur.kind : 'eq';
  const tabs = [['band', '滤波器'], ['matrix', '矩阵'], ['rev', '混响']];
  const tab = st.tab || (kind === 'reverb' ? 'rev' : kind === 'eq' ? 'band' : 'matrix');
  const activePreset = st.presets.find(p => st.activeSink === st.prefix + p.id.replace(/-/g, '_'));

  return html`
  <div class="flex h-screen flex-col">
    <!-- 顶栏 -->
    <header class="flex flex-wrap items-center gap-3 border-b border-line bg-panel px-4 py-2.5">
      <div class="flex items-baseline gap-2">
        <span class="text-[13px] font-semibold tracking-tight">yinxiao</span>
        <span class="text-[11px] text-faint">音效编辑器</span>
      </div>
      <span class="text-[12px] font-medium">${cur ? cur.name : '—'}</span>
      <span class="rounded-full border border-line px-2.5 py-0.5 text-[10.5px] text-dim">
        默认输出：<span class=${activePreset ? 'text-fg' : ''}>${activePreset ? activePreset.name : '直通（无音效）'}</span>
      </span>
      <label class="flex cursor-pointer items-center gap-1.5 text-[11px] text-dim">
        <input type="checkbox" class="accent-fg" checked=${st.switchOnClick}
          onChange=${e => set({ switchOnClick: e.target.checked })} /> 点击预设即切换输出
      </label>
      <span class="flex-1"></span>
      ${st.flash ? html`<span class="text-[11px] text-fg">${st.flash}</span>` : null}
      <${Btn} kind=${st.live ? 'primary' : 'ghost'} onClick=${() => {
        const live = !st.live; set({ live });
        if (live && cur) schedule(kind === 'reverb' ? { reverb: cur.reverb } : { bands: cur.bands });
      }}>实时试听：${st.live ? '开' : '关'}<//>
      <${Btn} onClick=${bypass}>直通<//>
      <${Btn} onClick=${() => selectId(st.curId, { switchSink: true })}>设为当前输出<//>
      <${Btn} kind="primary" onClick=${save}>保存到磁盘<//>
      <${Btn} onClick=${revert}>放弃修改<//>
      <${Btn} onClick=${rollback}>回滚上次保存<//>
      <${Btn} kind="plain" title="切换黑白主题" onClick=${() => set({ theme: st.theme === 'dark' ? 'light' : 'dark' })}>
        ${st.theme === 'dark' ? '☾' : '☀'}<//>
    </header>

    <div class="flex min-h-0 flex-1">
      <!-- 预设列表 -->
      <aside class="flex w-56 shrink-0 flex-col border-r border-line bg-panel">
        <div class="flex items-center justify-between border-b border-line px-3 py-2">
          <span class="lbl">预设</span><span class="text-[10.5px] text-faint">${st.presets.length}</span>
        </div>
        <div class="min-h-0 flex-1 overflow-auto p-1.5">
          ${st.presets.map(p => {
            const on = p.id === st.curId, act = st.activeSink === st.prefix + p.id.replace(/-/g, '_');
            return html`<button key=${p.id} onClick=${() => selectId(p.id)}
              class=${'mb-0.5 w-full rounded-md px-2.5 py-2 text-left transition-colors ' +
                      (on ? 'bg-raised ring-1 ring-line' : 'hover:bg-raised')}>
              <div class="flex items-center gap-1.5 text-[12px] font-medium">
                ${p.name}${act ? html`<span title="当前输出">●</span>` : null}
                ${p.dirty ? html`<span class="text-faint" title="有未保存的修改">*</span>` : null}
              </div>
              <div class="mt-0.5 line-clamp-2 text-[10.5px] leading-snug text-faint">${p.desc || p.id}</div>
            </button>`;
          })}
        </div>
      </aside>

      <!-- 曲线 + 状态栏 + 底部面板 -->
      <main class="flex min-w-0 flex-1 flex-col">
        <div class="relative min-h-[220px] flex-1">
          <${Curve} st=${st} cur=${cur} set=${set} schedule=${schedule} />
        </div>
        <${StatusBar} st=${st} cur=${cur} set=${set} schedule=${schedule} />
        <div class="border-t border-line bg-panel">
          <div class="flex items-center gap-3 px-3 py-2">
            <${Tabs} items=${tabs} value=${tab} onChange=${v => set({ tab: v })} />
            <span class="text-[10.5px] text-faint">${
              kind === 'eq' ? '拖动圆点改频率/增益 · 滚轮改 Q · Del 删除'
              : kind === 'reverb' ? '混响型：拖干湿比改混响量，湿/干与 RT60 实时回读'
              : '矩阵型：调宽度 / 分频点'}</span>
            <span class="ml-auto text-[10.5px] text-faint">${
              (KIND_NAME[kind] || kind) + (cur.bands && cur.bands.length ? ` · ${cur.bands.length} 段` : '')}</span>
          </div>
          <div class="max-h-56 min-h-[152px] overflow-auto px-4 pb-4 pt-1">
            ${tab === 'band' ? (kind === 'eq'
                ? html`<${BandPanel} cur=${cur} st=${st} set=${set} schedule=${schedule}
                        addBand=${addBand} delBand=${delBand} />`
                : html`<p class="text-[11px] text-faint">这个预设不是参数均衡型，没有可拖的滤波器段。</p>`)
            : tab === 'rev' ? (kind === 'reverb'
                ? html`<${ReverbPanel} cur=${cur} st=${st} set=${set} schedule=${schedule} />`
                : html`<p class="text-[11px] text-faint">只有厅堂混响预设（演唱会 / 音乐厅 / Live House / 大教堂）有这个面板。</p>`)
            : (kind === 'widen' || kind === 'sub'
                ? html`<${MatrixPanel} cur=${cur} st=${st} set=${set} schedule=${schedule} />`
                : html`<p class="text-[11px] text-faint">只有声场 / 低音类预设（3D 环绕、HIFI 现场、贴耳人声、重低音炮）有这个面板。</p>`)}
          </div>
        </div>
      </main>
    </div>
  </div>
  ${st.err ? html`<div class="fixed bottom-3 right-3 max-w-md rounded-md border border-line bg-panel px-3 py-2 text-[11px]">
    ${st.err}</div>` : null}`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
